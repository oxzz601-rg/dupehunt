name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Scan a folder with known duplicates
        run: |
          mkdir -p demo/a demo/b
          printf 'same bytes' > demo/a/one.txt
          cp demo/a/one.txt demo/b/two.txt
          python -m dupehunt scan demo
          python -m dupehunt quarantine demo --to outbox --apply
